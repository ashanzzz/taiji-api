name: Test and publish image
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: npm run check
      - run: npm test
      - name: Reject tracked runtime secrets
        run: node scripts/check-secrets.mjs
      - name: Container smoke test
        run: |
          docker build -t taiji-smoke .
          docker run -d --name taiji-smoke -p 127.0.0.1:3100:3000 -e PROXY_API_KEY=ci-test-key-not-a-secret -e ADMIN_KEY=ci-admin-not-a-secret taiji-smoke
          for i in $(seq 1 20); do
            if curl --fail http://127.0.0.1:3100/healthz; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:3100/healthz
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/admin/state)" = '401'
          curl --fail http://127.0.0.1:3100/ > /dev/null
          docker stop taiji-smoke
  publish:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image names
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          IMAGE="ghcr.io/${REPOSITORY,,}"
          echo "name=$IMAGE" >> "$GITHUB_OUTPUT"
          if [ "$REF_TYPE" = 'tag' ]; then
            echo "tags=$IMAGE:$REF_NAME,$IMAGE:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=$IMAGE:latest,$IMAGE:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
