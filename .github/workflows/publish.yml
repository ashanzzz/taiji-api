name: Test and publish image
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: npm run check
      - run: npm test
      - name: Reject tracked runtime secrets
        run: node scripts/check-secrets.mjs
      - name: Container smoke test
        run: |
          docker build -t taiji-smoke .
          docker run -d --name taiji-smoke -p 127.0.0.1:3100:3000 -e PROXY_API_KEY=ci-test-key-not-a-secret -e ADMIN_KEY=ci-admin-not-a-secret taiji-smoke
          for i in $(seq 1 20); do
            if curl --fail http://127.0.0.1:3100/healthz; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:3100/healthz
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/admin/state)" = '401'
          curl --fail http://127.0.0.1:3100/ > /dev/null
          docker stop taiji-smoke
  publish:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image names
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          IMAGE="ghcr.io/${REPOSITORY,,}"
          echo "name=$IMAGE" >> "$GITHUB_OUTPUT"
          if [ "$REF_TYPE" = 'tag' ]; then
            echo "tags=$IMAGE:$REF_NAME,$IMAGE:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=$IMAGE:latest,$IMAGE:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify private package visibility
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VISIBILITY=$(gh api "users/${GITHUB_REPOSITORY_OWNER}/packages/container/${GITHUB_REPOSITORY#*/}" --jq '.visibility')
          echo "Container package visibility: $VISIBILITY"
          test "$VISIBILITY" = 'private'
